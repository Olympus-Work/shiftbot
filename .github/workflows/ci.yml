name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 24 is what production runs and the supported floor (engines:
        # >=24.9). Kept as a one-entry matrix so the check stays named
        # "bot (24)" for branch protection.
        node: ['24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # No DB needed: nothing under src/**/*.spec.ts imports TypeOrmModule,
      # so the wiring specs boot a real server without postgres.
      # Jest can only load the ESM-only NestJS 12 packages on Node >= 24.9
      # (earlier versions fail with ERR_REQUIRE_ASYNC_MODULE).
      - name: Test
        run: npm test

      - name: Build
        run: npx nest build

      # The suite mocks MarketDataService, so a jest pass does not prove ccxt
      # itself still loads under CJS at runtime. This is the check that would
      # have caught the ccxt 4.5.73 ESM break as a boot failure.
      - name: ccxt loads under CJS
        run: node -e "require('ccxt'); console.log('ccxt ok')"

      # Same idea for NestJS 12: jest runs under --experimental-vm-modules, so
      # require the compiled module graph (every controller, service and Nest
      # package) under plain CJS to prove the app loads the way `npm start` does.
      - name: App module loads under CJS
        run: node -e "require('./dist/app.module'); console.log('app.module ok')"

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
        working-directory: dashboard

      - run: npm run build
        working-directory: dashboard
