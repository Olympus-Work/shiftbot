version: 2

updates:
  # NestJS bot (root package.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore(dev)
      include: scope
    ignore:
      # Types track the runtime production runs (Node 24, see engines); newer
      # majors would let code type-check against APIs Node 24 doesn't have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Majors land as their own PR — they need a real look.
    groups:
      bot-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Vite + React dashboard
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore(dev)
      include: scope
    groups:
      dashboard-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
